# JVM options used by the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable the Gradle build cache.
org.gradle.caching=true

# Keep configuration cache off for now - the IntelliJ Platform Gradle Plugin
# and some of its tasks do not fully support it yet.
org.gradle.configuration-cache=false
