import org.jetbrains.intellij.platform.gradle.IntelliJPlatformType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group = 'gitflow4idea'
version = '0.7.9'

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        // Target WebStorm 2026.2.3 (build 262.*).
        // Git4Idea and the Tasks plugin are bundled with WebStorm and PyCharm,
        // which makes WebStorm the smallest common denominator for both IDEs.
        webstorm('2026.2.3')

        bundledPlugin('Git4Idea')
        bundledPlugin('com.intellij.tasks')

        // Git4Idea's bundled-plugin descriptor does not declare its platform
        // module dependencies, so the shared DVCS modules have to be added
        // explicitly. Without them com.intellij.dvcs.* is not on the classpath.
        bundledModule('intellij.platform.vcs.dvcs')
        bundledModule('intellij.platform.vcs.dvcs.impl')
        bundledModule('intellij.platform.vcs.dvcs.impl.shared')

        pluginVerifier()
        zipSigner()
    }
}

// The IntelliJ Platform 2026.x is built with Java 25.
// A JDK 25 toolchain is required; Gradle auto-detects it from /usr/lib/jvm.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

intellijPlatform {
    // Skipping the searchable options index keeps the build fast and does not
    // require launching a full IDE instance.
    buildSearchableOptions = false
    instrumentCode = true

    pluginVerification {
        // Verify against the platforms this plugin targets: the IntelliJ Platform
        // it is built against (WebStorm 2026.2.3) and PyCharm 2026.2.3.
        ides {
            current()
            create(IntelliJPlatformType.PyCharm, '2026.2.3')

            // Locally installed Toolbox IDEs (if present) are verified without
            // downloading anything - handy for checking a new IDE release.
            def toolboxApps = file("${System.getProperty('user.home')}/.local/share/JetBrains/Toolbox/apps")
            ['webstorm', 'pycharm'].each { name ->
                def ideDir = new File(toolboxApps, name)
                if (ideDir.isDirectory()) {
                    local(ideDir.absolutePath)
                }
            }
        }
    }
    pluginConfiguration {
        id = 'Gitflow'
        name = 'Git Flow Integration'
        version = '0.7.9'
        description = "Git Flow Integration - a UI layer for Vincent Driessen's git-flow branching model (feature, release, hotfix and bugfix branches) right inside the IDE."

        ideaVersion {
            sinceBuild = '262'
            // No upper bound: stay compatible with all future IDE builds.
            untilBuild = provider { null }
        }

        changeNotes = """

      <H2>Changelog for 0.7.9</H2>
      <ul>
        <li>Verified compatibility with WebStorm 2026.3 and PyCharm 2026.3</li>
        <li>Plugin verification can now check locally installed JetBrains IDEs</li>
      </ul>

      <H2>Changelog for 0.7.8</H2>
      <ul>
        <li>Support for IntelliJ Platform 2026.2 (WebStorm / PyCharm 2026.2)</li>
        <li>Migrated to the IntelliJ Platform Gradle Plugin 2.x</li>
        <li>Target the Java 25 runtime required by the 2026.x platform</li>
      </ul>

      <H2>Changelog for 0.7.7</H2>
      <ul>
        <li>Fix issue with "Unsupported gitflow version" message presented at startup #328 #329</li>
        <li>Support for 2021.2 build</li>
      </ul>

      <H2>Changelog for 0.7.6</H2>
      <ul>
        <li>Fix "Error using shortcuts" #322</li>
        <li>fix Finishing BugFix throws stacktrace #320</li>
        <li>Support for 2021.1 build</li>
      </ul>

      <H2>Changelog for 0.7.5</H2>
      <ul>
        <li>PluginException: Icon cannot be found in 'AllIcons.Vcs.CheckOut' #314 (@tumb1er)</li>
        <li>Support for 2020.3 build</li>
      </ul>

    <p>Note - if you see 'no gitflow' in the status bar you will need to re-init using <code>git flow init -f</code></p>
      """
    }
}


